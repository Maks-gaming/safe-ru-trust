name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh "${GITHUB_REF_NAME#v}"
      - run: |
          cp windows/get.ps1 unix/get.sh dist/
          mkdir win nix
          cp windows/* dist/*.crt dist/manifest.txt win/
          cp unix/safe-ru-trust.sh dist/*.crt dist/manifest.txt nix/
          (cd win && zip -q ../dist/safe-ru-trust-windows.zip *)
          tar czf dist/safe-ru-trust-unix.tar.gz -C nix .
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
